stages:
  - test
  - deploy

sqlite3:
  stage: test
  image: python:3.10
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - $HOME/.local/bin/poetry config virtualenvs.create false
    - $HOME/.local/bin/poetry install --no-interaction
    - scripts/update_translations.sh
    - python -m readme_renderer README.md >/dev/null
    - python -Wd -m coverage run --branch --source=taguette test_main.py -v
    - coverage report
#    - coverage html
#    - coverage report | tail -n 1 | grep -o '\([0-9]\+\(\.[0-9]\+\)\?%\)$'
#    - flake8 --ignore=W503,W504 tests taguette
#    - "! find taguette -name '*.py' -exec grep --color 'raise \\(validate\\.\\)\\?InvalidFormat([^_]' {} +"
  artifacts:
    paths:
      - htmlcov

frontend_chromium_redis:
  stage: test
  image: python:3.10
  services:
    - redis:latest
  script:
    - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -yy xvfb chromium-driver
    - curl -sSL https://install.python-poetry.org | python3 -
    - $HOME/.local/bin/poetry config virtualenvs.create false
    - $HOME/.local/bin/poetry install --no-interaction
    - scripts/update_translations.sh
    - >
      TAGUETTE_TEST_WEBDRIVER=chromium
      TAGUETTE_TEST_REDIS=redis://redis:6379
      xvfb-run python -m unittest
      tests.e2e.test_e2e_multi_user.Test2E2MultiUser -v