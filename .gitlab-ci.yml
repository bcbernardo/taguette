stages:
  - prepare_image
  - test
  - deploy

build_image:
  stage: prepare_image
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker_dind
  variables:
    DOCKER_HOST=tcp://docker_dind:2375
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  # Default branch leaves tag empty (= latest tag)
  # All other branches are tagged with the escaped branch name (commit ref slug)
  script:
    - |
      echo '
      FROM python:3.11
      RUN apt-get update
      ENV DEBIAN_FRONTEND=noninteractive
      RUN apt-get install -yy xvfb firefox-esr chromium-driver rsync curl software-properties-common apt-transport-https ca-certificates
      RUN curl -fSsL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      RUN echo deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main | tee /etc/apt/sources.list.d/google-chrome.list
      RUN apt-get update
      RUN apt install -y google-chrome-stable
      RUN curl -Lo /tmp/geckodriver.tar.gz https://github.com/mozilla/geckodriver/releases/download/v0.30.0/geckodriver-v0.30.0-linux64.tar.gz
      RUN tar -zxf /tmp/geckodriver.tar.gz -C /usr/local/bin geckodriver
      RUN chmod +x /usr/local/bin/geckodriver
      WORKDIR /app
      COPY . /app
      RUN curl -sSL https://install.python-poetry.org | python3 -
      RUN $HOME/.local/bin/poetry config virtualenvs.create false
      RUN $HOME/.local/bin/poetry install --no-interaction -E postgres -E mysql
      RUN mkdir -p ./poetry_bin
      RUN rsync -rvah $HOME/.local/bin/* ./poetry_bin
      RUN ls -la /usr/bin/ | grep chrome
      ' > Dockerfile
    - docker build --pull -t "${CI_REGISTRY_IMAGE}:tests" .
    - docker push "${CI_REGISTRY_IMAGE}:tests"

sqlite3:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - $HOME/.local/bin/poetry config virtualenvs.create false
    - $HOME/.local/bin/poetry install --no-interaction
    - scripts/update_translations.sh
    - python -m readme_renderer README.md >/dev/null
    - python -Wd -m coverage run --branch --source=taguette test_main.py -v
    - coverage report
    - coverage html
    - coverage report | tail -n 1 | grep -o '\([0-9]\+\(\.[0-9]\+\)\?%\)$'
    - flake8 --ignore=W503,W504 tests taguette
    - "! find taguette -name '*.py' -exec grep --color 'raise \\(validate\\.\\)\\?InvalidFormat([^_]' {} +"
  artifacts:
    paths:
      - htmlcov

sqlite3_redis:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  services:
    - redis:latest
  script:
    - TAGUETTE_TEST_REDIS=redis://redis:6379 python -Wd test_main.py -v

frontend_firefox:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  script:
    - >
      TAGUETTE_TEST_WEBDRIVER=firefox xvfb-run python -m unittest
      tests.e2e.test_e2e_multi_user.Test2E2MultiUser -v

frontend_chromium_redis:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  services:
    - redis:latest
  script:
    - >
      TAGUETTE_TEST_WEBDRIVER=chromium
      TAGUETTE_TEST_REDIS=redis://redis:6379
      xvfb-run python -m unittest
      tests.e2e.test_e2e_multi_user.Test2E2MultiUser -v

frontend_chromium_subdir:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  script:
    - >
      TAGUETTE_TEST_WEBDRIVER=chromium
      TAGUETTE_TEST_BASE_PATH=/base/path
      xvfb-run python -m unittest
      tests.e2e.test_e2e_multi_user.Test2E2MultiUser -v

sqlite3_latest:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - $HOME/.local/bin/poetry config virtualenvs.create false
    - rm poetry.lock
    - sed -i 's/^python = ".*$/python = "^3.11"/' pyproject.toml
    - cat pyproject.toml
    - $HOME/.local/bin/poetry install --no-interaction
    - scripts/update_translations.sh
    - python -Wd test_main.py -v

sqlite3_latest_pip:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - pip --disable-pip-version-check --no-cache-dir install --upgrade pip
    - pip --disable-pip-version-check --no-cache-dir install "babel<3"
    - scripts/update_translations.sh
    - $HOME/.local/bin/poetry build
    - rm -rf taguette
    - pip --disable-pip-version-check --no-cache-dir install --upgrade dist/taguette-*.whl bcrypt "aiohttp>=3.4,<4"
    - python -Wd test_main.py -v

postgres:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  services:
    - postgres:latest
  variables:
    POSTGRES_USER: taguette
    POSTGRES_PASSWORD: taguette
    TAGUETTE_TEST_DB: postgresql://taguette:taguette@postgres/taguette
  script:
    - python -Wd test_main.py -v

mariadb:
  stage: test
  image: ${CI_REGISTRY_IMAGE}:tests
  services:
    - mariadb:latest
  variables:
    MYSQL_DATABASE: taguette
    MYSQL_ROOT_PASSWORD: password
    MYSQL_USER: taguette
    MYSQL_PASSWORD: taguette
    TAGUETTE_TEST_DB: mysql+pymysql://taguette:taguette@mariadb/taguette
  script:
    - python -Wd test_main.py -v

sqlite3_pypy:
  stage: test
  image: pypy:3.11
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - $HOME/.local/bin/poetry config virtualenvs.create false
    - pypy3 -m venv /tmp/venv
    - . /tmp/venv/bin/activate
    - pip --disable-pip-version-check --no-cache-dir install --upgrade pip
    - $HOME/.local/bin/poetry install --no-interaction
    - scripts/update_translations.sh
    - python -Wd test_main.py -v

deploy_staging:
  image: alpine:latest
  stage: deploy
  when: always
  script:
    - apk add rsync openssh-client
    - mv $SSH_KEY_DEPLOY /ssh_identity
    - cp .gitlab/config.ssh /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[proxy-host\]/${PROXY_HOST}/" /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[goto-host\]/${STAGING_HOST}/" /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[username\]/${USERNAME}/" /etc/ssh/ssh_config.d/project.conf
    - chmod 700 /ssh_identity
    - ssh "${USERNAME}@libreqda" touch /opt/libreqda/doUpdateCode
  only:
    - Staging

deploy_beta:
  image: alpine:latest
  stage: deploy
  when: always
  script:
    - apk add rsync openssh-client
    - mv $SSH_KEY_DEPLOY /ssh_identity
    - cp .gitlab/config.ssh /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[proxy-host\]/${PROXY_HOST}/" /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[goto-host\]/${BETA_HOST}/" /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[username\]/${USERNAME}/" /etc/ssh/ssh_config.d/project.conf
    - chmod 700 /ssh_identity
    - ssh "${USERNAME}@libreqda" touch /opt/libreqda/doUpdateCode
  only:
    - beta

deploy_prod:
  image: alpine:latest
  stage: deploy
  when: manual
  script:
    - apk add rsync openssh-client
    - mv $SSH_KEY_DEPLOY /ssh_identity
    - cp .gitlab/config.ssh /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[proxy-host\]/${PROXY_HOST}/" /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[goto-host\]/${PROD_HOST}/" /etc/ssh/ssh_config.d/project.conf
    - sed -i "s/\[username\]/${USERNAME}/" /etc/ssh/ssh_config.d/project.conf
    - chmod 700 /ssh_identity
    - ssh "${USERNAME}@libreqda" touch /opt/libreqda/doUpdateCode
  only:
    - main