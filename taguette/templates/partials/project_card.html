<a href="{{ reverse_url('project', project.id) }}{% if demo %}?demo=true{% endif %}" class="col-md-3 no-underline project">
    <div class="project-card">
        <div class="d-flex justify-content-end px-3 pt-3">
            <!-- <i class="fas fa-edit" onclick=""></i>-->
        </div>
        <div class="px-3 d-flex align-items-center">
            <div class="project-icon mr-2 d-flex align-items-center justify-content-center">
                <span class="text">{{ project.name[0] }}</span>
            </div>
            <h3 class="name px-3">{{ project.name }}</h3>
        </div>
        <div class="px-3 pt-4">
            <p class="quote2 flexible">{{ project.description | truncate(100, true, '...') }}</p>
        </div>
        <hr class="custom-hr">
        <div class="d-flex justify-content-between px-3 pb-3">
            <div class="d-flex align-items-center">
                <i class="fas fa-file"></i>
                <span class="quote2 mx-2">{{ project.document_count }} documents</span>
            </div>
            <div class="d-flex align-items-center">
                <i class="fas fa-tag"></i>
                <span class="quote2 mx-2">{{ project.tag_count }} tags</span>
            </div>
        </div>
    </div>
</a>
